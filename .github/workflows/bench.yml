name: Benchmark

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Run benchmarks
        run: pnpm test:bench
