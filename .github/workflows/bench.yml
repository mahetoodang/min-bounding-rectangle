name: Benchmark

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        run: npm run test:bench
